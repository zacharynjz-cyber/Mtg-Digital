function addCard(c){const k=k0(),l=c.n.toLowerCase();err='';
 if(k.cards.length>=FM[k.fmt])err='Deck is full for '+k.fmt+'.';
 else if(!BASIC.includes(l)&&k.cards.some(x=>x.n.toLowerCase()==l))err='Duplicate removed: '+c.n+' is already in this deck.';
 else{k.cards.push(c);if(!me.lib.some(x=>x.n.toLowerCase()==l))me.lib.push(c);sv()}edit()}
function rmCard(j){const k=k0();if(k.cards[j].n==k.cmd)k.cmd='';k.cards.splice(j,1);sv();edit()}
async function shrink(f){const b=await createImageBitmap(f),s=Math.min(1,1024/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function camOn(){err='';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});cam=1;edit();$('#cv').srcObject=stream}catch(e){cam=0;stream=null;const i=$('#sc');if(i)i.click()}}
function snap(){const v=$('#cv');if(!v||!v.videoWidth)return;const c=document.createElement('canvas'),s=Math.min(1,1024/Math.max(v.videoWidth,v.videoHeight));c.width=v.videoWidth*s;c.height=v.videoHeight*s;c.getContext('2d').drawImage(v,0,0,c.width,c.height);camOff();c.toBlob(b=>scan(b),'image/jpeg',.85)}
function camOff(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}cam=0;edit()}
async function scan(f){if(!f)return;busy=1;err='';edit();let c;try{f=await shrink(f)}catch(e){}
 try{c=await sample.json('Identify the Magic: The Gathering card in this photo. Reply ONLY with JSON: {"name":string,"type":"Creature"|"Land"|"Instant"|"Sorcery"|"Artifact"|"Enchantment"|"Planeswalker","cost":number (mana value),"power":number,"toughness":number,"legendary":boolean}. If this is not an MTG card reply {"name":""}.',{images:f,modelTier:'quick',cache:false})}catch(e){err=sample?'Scan failed ('+((e&&(e.message||e.code))||'unknown')+'). Try again.':'Card scanning isn’t available right now.'}
 busy=0;if(c&&c.name)addCard({n:String(c.name).slice(0,40),t:c.type||'Creature',c:c.cost|0,p:c.power|0,th:c.toughness|0,lg:!!c.legendary});else{err=err||'Couldn’t read that card. Retake the photo.';edit()}}
function lib(){A.innerHTML=`<div class="row sp"><h2>Library <span class="mu">${me.lib.length} cards</span></h2>${BK}</div><p class="mu">Swipe left to delete a card.</p>${me.lib.map((c,i)=>`<div class="sw"><div class="in" ontouchstart="sx=event.touches[0].clientX" ontouchend="te(event,'libDel',${i})">${cd(c,46)}<span style="flex:1;padding-left:12px"><b>${esc(c.n)}</b><div class="mu">${esc(c.t)}${c.t=='Creature'?' · '+c.p+'/'+c.th:''}</div></span><button class="b red" onclick="libDel(${i})">×</button></div></div>`).join('')||'<p class="mu">Scan cards into a deck and they will appear here.</p>'}`}
function libDel(i){me.lib.splice(i,1);sv();lib()}
/* PROFILE / SOCIAL */
function profile(){A.innerHTML=`<div class="row sp"><h2>Profile</h2>${BK}</div><div class="fr pad row"><div style="position:relative">${av(me,64)}<button class="ed" onclick="$('#ph').click()" aria-label="Change photo">${PEN}</button></div><div><h2 style="margin:0">${esc(me.name)}</h2><div class="mu">Planeswalker</div></div></div><h3>Settings</h3><div class="fr pad"><div class="row sp">Theme<select style="width:130px" onchange="me.theme=this.value;sv();applyT()">${['auto','light','dark'].map(t=>`<option ${me.theme==t?'selected':''}>${t}</option>`).join('')}</select></div><div class="row sp" style="margin:10px 0">Camera effects<input type="checkbox" style="width:22px;height:22px" ${me.fx?'checked':''} onchange="me.fx=this.checked;sv()"></div><input id="ph" type="file" accept="image/*" hidden onchange="photo(this.files[0])">${me.av?`<button class="b gry w" onclick="me.av='';sv();profile()">Remove profile photo</button>`:''}</div><button class="b gold w" onclick="go('acct')">Account</button><br><br><button class="b gry w" onclick="me=null;clearSess();applyT();render()">Sign out</button>`}
async function rz(f,s){const b=await createImageBitmap(f),c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(b.width,b.height);c.getContext('2d').drawImage(b,(b.width-m)/2,(b.height-m)/2,m,m,0,0,s,s);return c.toDataURL('image/jpeg',.8)}
async function photo(f){if(!f)return;me.av=await rz(f,128);sv();profile()}
async function acct(){const rs=await R.list();A.innerHTML=`<h2>Account</h2><div class="fr pad"><div class="mu">Username (locked)</div><b>${esc(me.name)}</b><div class="mu" style="margin-top:10px">Password (locked)</div><b>••••••••</b><div class="mu" style="margin-top:10px">Date joined</div><b>${new Date(me.joined).toLocaleDateString()}</b><div class="mu" style="margin-top:10px">Games played</div><b>${me.plays}</b><div class="mu" style="margin-top:10px">Play time</div><b>${Math.floor(me.secs/60)} min</b></div><h3>Friend requests</h3>${rs.map((r,i)=>`<div class="fr pad row sp"><b>${esc(r.from)}</b><span class="row"><button class="b grn" onclick="accReq(${i})">Accept</button><button class="b red" onclick="decReq(${i})">Decline</button></span></div>`).join('')||'<p class="mu">No requests.</p>'}<button class="b gry w" onclick="go('profile')">Back</button>`;window._rs=rs}
async function accReq(i){const r=window._rs[i];if(!me.friends.includes(r.from))me.friends.push(r.from);sv();try{const o=await DB.get(r.from.toLowerCase());if(o&&!o.friends.includes(me.name)){o.friends.push(me.name);await DB.put(r.from.toLowerCase(),o)}}catch(e){}await R.del(r);acct()}
async function decReq(i){await R.del(window._rs[i]);acct()}
const on=n=>n=='Sam'||peers.some(p=>p.presence.n.toLowerCase()==n.toLowerCase());
function friends(){A.innerHTML=`<div class="row sp"><h2>Friends</h2>${BK}</div><div class="row"><input id="fs" placeholder="Search by username"><button class="b blu" onclick="addF()">Send request</button></div><div class="err">${err}</div>${me.friends.map(f=>`<div class="fr pad row sp"><span class="row">${av({name:f},40)}<b>${esc(f)}</b></span><span class="mu"><i class="dot ${on(f)?'on':''}"></i>${on(f)?'Online':'Offline'}</span></div>`).join('')||'<p class="mu">No friends yet.</p>'}`}
async function addF(){const n=$('#fs').value.trim(),k=n.toLowerCase();if(!n)return;if(k==N){err='You can’t add yourself.';return friends()}
 if(k=='sam'&&usr&&usr.isOwner()){if(!me.friends.includes('Sam')){me.friends.push('Sam');sv()}err='Sam accepted your friend request.';return friends()}if(!await DB.get(k)){err='No player named “'+esc(n)+'” found.';return friends()}await R.add({to:k,from:me.name});err='Request sent to '+esc(n)+'.';friends()}
/* PLAY LOBBY */
function play(){const ds=me.decks;A.innerHTML=`<div class="row sp"><h2>Play</h2>${BK}</div>${ds.length?'':'<p class="err">Create a deck first.</p>'}<select id="pd" onchange="pdCh()">${ds.map((d,i)=>`<option value="${i}">${esc(d.name)} · ${d.fmt}</option>`).join('')}</select><div class="err" id="pm"></div><button class="b gold w" id="qp" style="padding:20px;font-size:18px;margin:6px 0 14px" onclick="quick()">Quick Play</button><div class="mu" style="margin-bottom:6px">Friends</div>${me.friends.map(f=>`<div class="fr pad row sp"><span class="row">${av({name:f},34)}${esc(f)}</span><span class="row"><span class="mu"><i class="dot ${on(f)?'on':''}"></i>${on(f)?'Online':'Offline'}</span><button class="b grn" ${on(f)?'':'disabled'} onclick="invite('${esc(f)}')">Invite</button></span></div>`).join('')||'<p class="mu">Add friends from the Friends tab.</p>'}<div class="mu" style="margin:12px 0 6px">Players online now</div>${peers.map(p=>`<div class="fr pad row sp"><span class="row">${av({name:p.presence.n},34)}${esc(p.presence.n)}</span><span class="row"><i class="dot on"></i><button class="b grn" onclick="invite('${esc(p.presence.n)}')">Invite</button></span></div>`).join('')||'<p class="mu">Nobody else is online right now.</p>'}<p class="mu">Quick Play pairs you with another player searching for the same format.</p>`;pdCh()}
function pdCh(){const s=$('#pd');if(!s)return;const k=me.decks[s.value];const q=$('#qp');if(!k){q.disabled=true;return}const ok=ready(k);q.disabled=!ok;$('#pm').textContent=ok?'':`This deck needs ${Math.max(0,mn(k.fmt)-k.cards.length)} more cards${k.fmt=='Commander'&&!k.cmd?' and a commander':''} (90% of ${FM[k.fmt]}).`}
function quick(){const i=+$('#pd').value,f=me.decks[i].fmt;qs={i,f,t:Date.now()};A.innerHTML=`<h2 style="text-align:center;margin-top:60px">Finding an opponent…</h2><div class="spin"></div><p class="mu" style="text-align:center">${f} · searching for another player</p><button class="b gry w" onclick="qs=null;go('play')">Cancel</button>`;
 const tick=()=>{if(!qs)return;if(Date.now()-qs.t>20000){const q=qs;qs=null;A.innerHTML=`<h2 style="text-align:center;margin-top:60px">No players found</h2><p class="mu" style="text-align:center">Nobody else is searching for ${q.f} right now.</p><button class="b gold w" onclick="start(${q.i})">Play a practice opponent</button><br><br><button class="b gry w" onclick="go('play')">Back</button>`;return}try{room&&room.emit('q',{from:me.name,f})}catch(e){}setTimeout(tick,2000)};tick()}
/* GAME */
function start(i,opp,live){const k=me.decks[i],cm=k.fmt=='Commander';let cs=k.cards.map(c=>({...c})),cmd=null;if(cm){const j=cs.findIndex(c=>c.n==k.cmd);cmd=cs.splice(j,1)[0]}cs.sort(()=>Math.random()-.5);
 const h=cs.splice(0,7);h.forEach(c=>c.nw=1);G={cm,live,opp:opp||'Practice Opponent',me:{life:cm?40:20,lib:cs,hand:h,bf:[],gy:[],ex:[],cmd,tax:0},bot:{life:cm?40:20,bf:[]},my:!(live&&!live.first),drew:false,land:false,over:'',log:live&&!live.first?'Waiting for '+esc(opp)+' to take the first turn.':'Your turn. Draw, play a land, then cast spells.',t0:Date.now()};me.plays++;sv();tab='game';sel=-1;render();sync()}
function game(){const m=G.me,b=G.bot,my=G.my&&!G.over,s=m.bf[sel],dc=m.cmd?m.cmd.c+2*m.tax:0;
 const hand=m.hand.map((c,i)=>`<div class="${c.nw?'deal':''}" ${c.nw?`style="animation-delay:${i*.13}s"`:''} onclick="cast(${i})">${cd(c,68)}</div>`).join('');m.hand.forEach(c=>delete c.nw);
 A.innerHTML=`<div id="g"><div class="bar fr"><span>${esc(G.opp)}${G.live?`<br><span class="mu">Hand ${G.hn??7} · Library ${G.ln??'-'} · Grave ${(b.gy||[]).length}</span>`:''}</span><b class="life">${b.life}</b></div>
<div class="bf fr">${b.bf.map(c=>cd(c,50)).join('')||'<span class="mu">Opponent’s battlefield</span>'}</div><div class="log">${G.over||G.log}</div>
<div class="bf fr ${my?'turn':''}">${m.bf.map((c,i)=>`<div class="${c.tp?'tp':''} ${i==sel?'sel':''}" onclick="pk(${i})">${cd(c,50)}</div>`).join('')||'<span class="mu">Your battlefield</span>'}</div>
<div class="zones"><div class="z deckpile ${my&&!G.drew?'rdy':''}" onclick="draw()"><b>${m.lib.length}</b>Library</div><div class="z"><b>${m.gy.length}</b>Grave</div><div class="z"><b>${m.ex.length}</b>Exile</div>${G.cm?`<div class="z cz" onclick="castCmd()">${m.cmd?cd(m.cmd,30):'<b>—</b>'}<span>Command${m.tax?' +'+2*m.tax:''}</span></div>`:''}<div class="z"><b class="life">${m.life}</b>Life</div></div>
<div class="tray"><div class="hand">${hand}</div><div class="acts">${s&&my?`${s.t=='Creature'&&!s.tp&&!s.sick?'<button class="b red" onclick="atk()">Attack</button>':''}<button class="b gry" onclick="mv(\'gy\')">Graveyard</button><button class="b blu" onclick="mv(\'ex\')">Exile</button>${s.cm?'<button class="b gold" onclick="mv(\'cmd\')">Command zone</button>':''}`:''}<button class="b grn" ${my?'':'disabled'} onclick="endT()">End turn</button><button class="b gry" onclick="leave()">Leave</button></div></div></div>`}
function say(t){G.log=t;if(G.bot.life<=0)G.over='You win!';else if(G.me.life<=0)G.over='You lose.';sync();game()}
function draw(){const m=G.me;if(!G.my||G.drew||G.over)return;G.drew=true;if(m.lib.length){const c=m.lib.shift();c.nw=1;m.hand.push(c)}say('You drew a card.')}
function pay(n){const ls=G.me.bf.filter(c=>c.t=='Land'&&!c.tp);if(ls.length<n)return false;ls.slice(0,n).forEach(c=>c.tp=1);return true}
function cast(i){if(!G.my||G.over)return;const m=G.me,c=m.hand[i];
 if(c.t=='Land'){if(G.land)return say('You may play only one land per turn.');G.land=true;m.hand.splice(i,1);m.bf.push({...c,tp:0});return say('You played '+c.n+'.')}
 if(!pay(c.c))return say('Not enough untapped lands for '+c.n+' (cost '+c.c+').');m.hand.splice(i,1);
 if(/Instant|Sorcery/.test(c.t)){const d=Math.max(1,Math.min(4,c.c));G.bot.life-=d;dmg(d);m.gy.push(c);return say(c.n+' deals '+d+' damage.')}
 m.bf.push({...c,tp:0,sick:c.t=='Creature'});say('You cast '+c.n+'.')}
function castCmd(){if(!G.my||G.over||!G.me.cmd)return;const m=G.me,c=m.cmd,cost=c.c+2*m.tax;if(!pay(cost))return say('Commander costs '+cost+' ('+c.c+' + '+2*m.tax+' commander tax).');m.bf.push({...c,tp:0,sick:1,cm:1});m.cmd=null;m.tax++;say('You cast your commander for '+cost+'. Next time costs 2 more.')}
function pk(i){sel=sel==i?-1:i;game()}
function mv(z){const m=G.me,{tp,sick,...c}=m.bf[sel];m.bf.splice(sel,1);sel=-1;if(z=='cmd'){m.cmd=c;return say(c.n+' returned to the command zone.')}m[z].push(c);say(c.n+' moved to '+(z=='gy'?'graveyard':'exile')+'.')}
function atk(){const c=G.me.bf[sel];if(!c||c.tp||c.sick)return;c.tp=1;sel=-1;const bl=!G.live&&G.bot.bf.find(x=>x.th>c.p&&x.p<c.th);if(bl)return say(G.opp+' blocks '+c.n+' with '+bl.n+'.');G.bot.life-=c.p;dmg(c.p);say(c.n+' hits for '+c.p+'!')}
function endT(){const m=G.me;G.my=false;sel=-1;if(G.live){G.log='Waiting for '+esc(G.opp)+'…';sync(1);return game()}say(G.opp+' is taking a turn…');
 setTimeout(()=>{const b=G.bot,n=['Goblin Raider','Elf Scout','Stone Golem','Sky Drake'][Math.random()*4|0],hit=b.bf.filter(c=>!c.sick).reduce((s,c)=>s+c.p,0);b.bf.forEach(c=>c.sick=0);b.bf.push({n,t:'Creature',c:1,p:Math.random()*3+1|0,th:Math.random()*3+1|0,sick:1});m.life-=hit;
 m.bf.forEach(c=>{c.tp=0;c.sick=0});G.my=true;G.drew=false;G.land=false;say(G.opp+' cast '+n+(hit?' and attacked for '+hit:'')+'. Your turn: click your library to draw.')},1400)}
function leave(){if(G.live){G.me.life=0;sync()}me.secs+=Math.floor((Date.now()-G.t0)/1000);sv();G=null;go('play')}
const dk=f=>me.decks.findIndex(k=>k.fmt==f&&ready(k));
function dlg(h){const o=document.createElement('div');o.className='mod';o.innerHTML=h;document.body.appendChild(o);return o}
function invite(n){const i=+$('#pd').value,k=me.decks[i];if(!k||!ready(k))return pdCh();if(n=='Sam')return start(i,'Sam');if(!room)return;const id=N+':'+Date.now();pend={id,i,t:Date.now()};room.emit('inv',{to:n,from:me.name,f:k.fmt,id});$('#pm').textContent='Invite sent to '+n+'. Waiting for them to accept…'}
function sync(end){if(!G||!G.live||!room)return;const m=G.me;try{room.emit('st',{id:G.live.id,end:end?1:0,hn:m.hand.length,ln:m.lib.length,s:{life:m.life,bf:m.bf.map(c=>({n:c.n,t:c.t,c:c.c,p:c.p,th:c.th,tp:c.tp})),gy:m.gy.length,ex:m.ex.length}})}catch(e){}}
function dmg(a){if(G.live&&room)try{room.emit('dmg',{id:G.live.id,a})}catch(e){}}
function wire(){
 room.on('inv',m=>{const d=m.data;if(!d||m.isMe||d.to!=me.name||G)return;const i=dk(d.f);
  if(d.auto){if(qs&&qs.f==d.f){const q=qs;qs=null;room.emit('acc',{to:d.from,from:me.name,id:d.id});start(q.i,d.from,{id:d.id,first:false})}return}
  const o=dlg(`<div class="fr pad"><h3>Game invite</h3><p><b>${esc(d.from)}</b> wants to play <b>${esc(d.f)}</b>.</p>${i<0?`<p class="err">You have no ready ${esc(d.f)} deck.</p>`:''}<div class="row"><button class="b grn w" ${i<0?'disabled':''} id="ia">Accept</button><button class="b red w" id="id">Decline</button></div></div>`);
  o.querySelector('#id').onclick=()=>o.remove();o.querySelector('#ia').onclick=()=>{o.remove();room.emit('acc',{to:d.from,from:me.name,id:d.id});start(i,d.from,{id:d.id,first:false})}});
 room.on('acc',m=>{const d=m.data;if(!d||m.isMe||d.to!=me.name||!pend||pend.id!=d.id||G)return;const p=pend;pend=null;qs=null;start(p.i,d.from,{id:d.id,first:true})});
 room.on('q',m=>{const d=m.data;if(!d||m.isMe||!qs||G||d.f!=qs.f||me.name.toLowerCase()>=String(d.from).toLowerCase()||(pend&&Date.now()-pend.t<5000))return;const id=N+':'+Date.now();pend={id,i:qs.i,t:Date.now()};room.emit('inv',{to:d.from,from:me.name,f:qs.f,id,auto:1})});
 room.on('st',m=>{const d=m.data;if(!d||m.isMe||!G||!G.live||G.live.id!=d.id)return;const s=d.s||{};G.bot={life:s.life|0,bf:(s.bf||[]).slice(0,40).map(c=>({n:String(c.n).slice(0,40),t:String(c.t).slice(0,12),c:c.c|0,p:c.p|0,th:c.th|0,tp:c.tp?1:0})),gy:new Array(Math.min(300,s.gy|0)),ex:new Array(Math.min(300,s.ex|0))};G.hn=d.hn|0;G.ln=d.ln|0;
  if(d.end&&!G.my&&!G.over){G.my=true;G.drew=false;G.land=false;G.me.bf.forEach(c=>{c.tp=0;c.sick=0});G.log='Your turn: click your library to draw.'}
  if(G.bot.life<=0)G.over='You win!';if(tab=='game')game()});
 room.on('dmg',m=>{const d=m.data;if(!d||m.isMe||!G||!G.live||G.live.id!=d.id)return;const a=Math.max(0,Math.min(20,d.a|0));G.me.life-=a;say(esc(G.opp)+' hits you for '+a+'.')})}
A.innerHTML='<div class="logo">MTG DIGITAL</div><div class="spin"></div>';
(async()=>{try{db=await claude.use('db')}catch(e){}try{room=await claude.use('room')}catch(e){}try{sample=await claude.use('sample')}catch(e){}try{usr=await claude.use('user')}catch(e){}
 let k=L('mtg_me');if(!k)k=await getSess();if(k){const a=await DB.get(k);if(a){me=a;N=k;applyT();return enter(k)}}render()})();
</script></body></html>
